name: CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: algolab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock

      - name: Lint backend
        run: python -m ruff check backend/src backend/tests

      - name: Test backend
        run: python -m pytest -c backend/pyproject.toml backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Azure Container Apps
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_CONTAINER_APP: ${{ vars.AZURE_API_CONTAINER_APP }}
      WEB_CONTAINER_APP: ${{ vars.AZURE_WEB_CONTAINER_APP }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push API image
        run: |
          image="$ACR_NAME.azurecr.io/algolab-api:$IMAGE_TAG"
          docker build --file backend/Dockerfile --tag "$image" backend
          docker push "$image"

      - name: Build and push frontend image
        run: |
          image="$ACR_NAME.azurecr.io/algolab-web:$IMAGE_TAG"
          docker build --file frontend/Dockerfile.azure --tag "$image" .
          docker push "$image"

      - name: Deploy API revision
        run: |
          az containerapp update \
            --name "$API_CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/algolab-api:$IMAGE_TAG"

      - name: Deploy frontend revision
        run: |
          az containerapp update \
            --name "$WEB_CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/algolab-web:$IMAGE_TAG"
