services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment:
      ALGOLAB_CORS_ORIGINS: ${ALGOLAB_CORS_ORIGINS:-}
    ports:
      - "${ALGOLAB_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ALGOLAB_WEB_PORT:-8081}:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
